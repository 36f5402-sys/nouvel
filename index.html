const col=b=>colors[catOf(b)]||'#5f6e7a';

function agesUI(){$('#ages').innerHTML=G.map((g,i)=>`<button class="sp ${i==age?'on':''} ${GAP[i]?'gap':''}" style="height:${HT[i]}px" data-a="${i}" aria-label="${g.label}"><b>${g.label.replace('초등 ','초등 ')}</b>${g.sub?`<i>${g.sub}</i>`:''}</button>`).join('')}
function card(b,extra='',rank=true,max=1){
 const L=liked.includes(key(b));
 return `<article class="bk">${rank?`<div class="rk">${b[0]}</div>`:''}<div class="cv" style="background:${col(b)}"><span>${esc(b[1].slice(0,2))}</span></div><div class="in"><h3>${esc(b[1])}${b[6]?` <small>${b[6]}권</small>`:''}</h3>
 <p class="m">${esc(b[3])}<span>${esc(b[4])}</span><span>${b[5]}</span><span>${catOf(b)}</span></p>
 ${extra||`<div class="lb"><div class="bar"><i style="width:${b[9]/max*100}%"></i></div><span>대출 ${b[9].toLocaleString()}회</span></div>`}</div>
 <button class="lk ${L?'on':''}" data-l="${key(b)}" aria-pressed="${L}">${L?'♥ 선택됨':'♡ 선택'}</button></article>`}
function showTop(){
 const bs=G[age].books,cats=['전체',...new Set(bs.map(catOf))];
 let l=bs.filter(b=>(cat==='전체'||catOf(b)===cat)&&(!q||(b[1]+b[3]).includes(q)));
 const max=bs[0][9];
 $('#view').innerHTML=`<div class="row"><input id="q" placeholder="제목 · 저자 검색" value="${esc(q)}"><select id="cat">${cats.map(c=>`<option ${c==cat?'selected':''}>${c}</option>`).join('')}</select></div>
 ${l.slice(0,shown).map(b=>card(b,'',true,max)).join('')||'<p class="em">검색 결과 없음</p>'}
 ${l.length>shown?`<button class="more" id="more">더 보기 (${l.length-shown})</button>`:''}`;
 const qi=$('#q');qi.oninput=e=>{q=e.target.value;shown=20;const p=qi.selectionStart;showTop();$('#q').focus();$('#q').setSelectionRange(p,p)};
 $('#cat').onchange=e=>{cat=e.target.value;shown=20;showTop()};
 const m=$('#more');if(m)m.onclick=()=>{shown+=30;showTop()};
}
function allBooks(){const m=new Map();G.forEach((g,gi)=>g.books.forEach(b=>{const k=key(b);if(!m.has(k))m.set(k,{b,ages:[]});m.get(k).ages.push(gi)}));return m}
function rec(){
 const all=allBooks(),likedB=liked.map(k=>all.get(k)?.b).filter(Boolean);
 const pool=scope==='age'?G[age].books.map(b=>all.get(key(b))):[...all.values()];
 const maxL=G[age].books[0][9];
 let res=pool.filter(x=>!liked.includes(key(x.b))).map(x=>{
  let s=0,why=[];
  likedB.forEach(l=>{
   if(l[3]===x.b[3]&&l[3]){s+=3;why.push(`동일 작가: ${l[3]}`)}
   if(base(l[1])===base(x.b[1])){s+=3;why.push(`동일 시리즈`)}
   if(catOf(l)===catOf(x.b)){s+=1.2}
   if(l[8]&&l[8].slice(0,3)===(x.b[8]||'').slice(0,3)&&catOf(l)!=='소설·문학'){s+=1.5;why.push(`동일 분야: ${catOf(l)}`)}
   if(l[4]===x.b[4]){s+=.4}});
  const inAge=x.ages.includes(age),ab=G[age].books.find(b=>key(b)===key(x.b));
  const pop=inAge?Math.log(1+ab[9])/Math.log(1+maxL):0;
  if(inAge)s+=pop*1.5;else s+=.3;
  if(!likedB.length&&!inAge)s=-1;
  return{...x,s,why:[...new Set(why)].slice(0,2),inAge}}).sort((a,b)=>b.s-a.s);
 if(!likedB.length){ // 인기 기반: 분야별로 고루
  const seen={};res=res.filter(x=>{const c=catOf(x.b);seen[c]=(seen[c]||0)+1;return seen[c]<=3})}
 res=res.filter(x=>x.s>0).slice(0,12);
 const ex=x=>{const w=x.why.length?x.why.join(' / '):(x.inAge?'해당 연령 인기 도서':`타 연령 인기: ${x.ages.map(i=>G[i].label).join(', ')}`);
  return `<p class="why">${esc(w)}</p>`};
 $('#view').innerHTML=`<div class="intro"><p>${likedB.length?'선택 도서 기준 추천 (작가 / 시리즈 / 분류)':'인기 순위에서 ♡ 선택 시 맞춤 추천. 미선택 시 분류별 인기 도서 표시'}</p>
 <div>${likedB.map(b=>`<button class="tag" data-l="${key(b)}">${esc(b[1])} ✕</button>`).join('')}</div></div>
 <div class="row"><select id="sc"><option value="age" ${scope=='age'?'selected':''}>추천 범위: 해당 연령</option><option value="all" ${scope=='all'?'selected':''}>추천 범위: 전체 연령</option></select></div>
 ${res.map(x=>card(x.b,ex(x),false)).join('')||'<p class="em">추천 결과 없음</p>'}`;
 $('#sc').onchange=e=>{scope=e.target.value;rec()};
}
function render(){agesUI();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===tab));tab==='top'?showTop():rec()}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-a]');if(a){age=+a.dataset.a;cat='전체';q='';shown=20;render();return}
 const t=e.target.closest('.tab');if(t){tab=t.dataset.t;render();return}
 const l=e.target.closest('[data-l]');if(l){const k=l.dataset.l;liked=liked.includes(k)?liked.filter(x=>x!==k):[...liked,k];render()}});
render();
</script></body></html>
